# DeepCode 设置分区的 launcher overlay（P8-D39）。
#
# 与皮肤/目录选择器同一模式：由 DeepCode 启动 Harness 时经 `--patch` 传入，
# 落在合成顺序最后一层，不进用户 profile——用户自己跑 `dsh web` 没有这层，
# 卸载 DeepCode 也零残留。
#
# 这一层只插一行：把 DeepCode 的设置分区插件加进本轮 composition。插件只
# 注册 settings.section（官方设置页的公开扩展点，AppearanceRow 同门），
# 分区里的每个动作经本机回环控制桥回到 Electron main 的同一个命令出口。
# 页面 URL 没有控制桥参数时（用户在外部浏览器打开 3080），插件什么都不注册。

- insert:
    - id: deepcode-settings
      name: '@see-sol-lab/deepcode-settings'
