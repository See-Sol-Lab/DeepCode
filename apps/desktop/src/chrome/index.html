<!DOCTYPE html>
<!--
  DeepSeekGUI Desktop Chrome：顶栏 + 菜单面板 + Harness 控制面。
  作为置顶 WebContentsView 渲染：平时只占顶栏高度，菜单展开时由 main
  扩展到全窗（本页背景透明，只有绘制的表面不透明）。
  Compatibility View（官方 Web UI）在它下方，永不被注入。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>DeepSeekGUI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="topbar">
    <button id="hamburger" class="icon-button no-drag" aria-haspopup="menu" aria-expanded="false" aria-controls="main-menu" title="菜单" data-i18n-title="menu.hamburger.title">
      <span class="hamburger-lines" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div id="brand" aria-hidden="true">
      <img id="brand-icon" src="./icon.png" alt="">
      <span id="brand-name">DeepSeekGUI</span>
    </div>
    <div id="recovery-banner" role="status" hidden>
      <span id="recovery-banner-text"></span>
      <button id="recovery-banner-details" class="mini-button no-drag" data-i18n="notice.details">查看详情</button>
      <button id="recovery-banner-ack" class="mini-button no-drag" data-i18n="notice.ack">知道了</button>
    </div>
    <!-- 内置浏览器 pane 的开关不在顶栏（B3-11 返工二审，住户定）：产品内
         功能按钮住在产品内容区——settings-plugin 把地球注册进官方会话头部
         的 utilities 槽（Session log 同排）；汉堡菜单里保留文字项作后备。 -->
    <!-- 状态胶囊是纯指示灯，不是按钮（P8-D19）：Harness 面板只从左上角菜单进，
         界面上不再有第二个入口。role=status 让读屏软件把它读成状态而不是控件；
         也不再加 no-drag——不可点的东西没理由占着顶栏的拖拽区。 -->
    <div id="status-pill" role="status" aria-live="polite">
      <span id="status-dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </div>
  </header>

  <div id="overlay" hidden>
    <div id="main-menu" class="panel" role="menu" aria-label="DeepSeekGUI 菜单" data-i18n-aria="menu.aria" hidden>
      <!-- 状态区（只读）：菜单一打开就看得见「它活着吗 / 跑的哪套 / 家在哪 / 什么
           权限」，不必先点进 Harness（P8-D19 信息区上提）。这里只陈述事实，动作
           全留在 Harness 二级面板里。 -->
      <div id="menu-status"><!-- 状态行由 renderer 填充 --></div>
      <!-- Harness 控制面 / 插件管理 / BUG 诊断与反馈已移居官方设置页的
           DeepSeekGUI 分区（P8-D39 第二批，住户 2026-08-23 定稿）：本菜单只剩
           状态区与桌面壳自己的事。 -->
      <div class="separator" role="separator"></div>
      <!-- 重启 Harness（B3-15，住户 2026-08-24 批准）：Harness 崩掉时设置页
           随官方 web UI 一起不可达（控制面就住在 3080 里），此前主窗口没有
           任何重启入口、只剩系统托盘——而故障态正是最需要它的时刻。chrome
           层是我们自己的 renderer，DSH 死了它照样在。 -->
      <!-- 插件恢复入口（2026-08-27 人工验收暴露的发布阻断项）：B3-15 当时只补了
           上面那个「重启 Harness」，而插件把 Harness 搞坏之后，重启只会再失败一次
           ——真正需要的「恢复上次插件变更」按钮住在官方设置页里，那页随 3080 一起
           死了。会敲命令的人还能靠 DSH 终端自救（实测走得通），不会敲的人一条路
           都没有。这个按钮由 renderer 按 model.pluginManager.recovery 显隐：
           recovery-needed 时给恢复，drift（文件被外部改过、绝不覆盖）时改为打开
           Profile 文件夹让用户自己处置。 -->
      <button class="menu-item" role="menuitem" id="menu-plugin-recovery" hidden>恢复上次插件变更</button>
      <button class="menu-item" role="menuitem" id="menu-restart-harness" data-command="restart-harness" data-i18n="menu.restart-harness">重启 Harness</button>
      <button class="menu-item" role="menuitem" id="menu-terminal" data-command="terminal" data-i18n="menu.terminal">DSH 终端</button>
      <!-- 内置浏览器 pane 开合（B3-11）：只在插件创建过 pane 后出现（hidden 由
           renderer 按 model.browserPane.present 控制），文案随开合状态切换。 -->
      <button class="menu-item" role="menuitem" id="menu-browser-pane" data-command="browser-pane" hidden>浏览器面板</button>
      <button class="menu-item" role="menuitem" id="menu-check-updates" data-command="check-updates" data-i18n="menu.update">检查更新</button>
      <div class="separator" role="separator"></div>
      <button class="menu-item" role="menuitem" id="menu-about" data-command="about" data-i18n="menu.about">关于 DeepSeekGUI</button>
      <!-- 「退出 DeepSeekGUI」已按 P8-D19 移除：退出走托盘右键，与菜单这条本来就是
           同一条 requestQuit 路径（main 的注释原话：「显式 Quit 的唯一入口，
           Chrome 菜单与 Tray 共用」）。人不会为了退出专门钻进菜单，而窗口的 X
           是隐藏不是退出，关窗时那条一次性提示已经把托盘那条路说清楚了。 -->
    </div>

    <!-- 检查更新（P8-D35①）：从诊断面板独立出来的专属小面板——版本简行 +
         检查动作 + 结果状态。之前与「BUG诊断与反馈」共用一个面板，住户实测
         点名不对（「检查更新进去就该是版本信息和检查」）。 -->
    <div id="update-panel" class="panel" role="dialog" aria-label="检查更新" data-i18n-aria="update.panel.aria" hidden>
      <button class="menu-item" id="update-back" data-i18n="action.back">‹ 返回</button>
      <div class="separator" role="separator"></div>
      <div id="update-info"><!-- 版本简行由 renderer 填充 --></div>
      <div id="update-status"><!-- 检查动作与结果由 renderer 填充 --></div>
    </div>

  </div>


  <script type="module" src="../../lib/chrome/renderer.js"></script>
</body>
</html>
