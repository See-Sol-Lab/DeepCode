# electron-builder configuration for the DeepSeekGUI distribution.
# Outputs an unpacked win32-x64 directory (for development verification) and a
# per-user NSIS installer (for end users). No signing, no auto-update.
# electron-builder 26 resolves relative paths against the project directory
# (the repository root), except `files` and `icon`, which resolve against
# `directories.app`.

# Final product identity: DeepSeekGUI, an unofficial community client owned by
# See-Sol-Lab — deliberately NOT under com.deepseek-ai, so the app never
# impersonates an official DeepSeek publication. Frozen as of the first
# commit; changing it later orphans installed users' registry entries.
appId: io.github.see-sol-lab.deepseekgui
productName: DeepSeekGUI
directories:
  app: apps/desktop
  output: dist/desktop

# Same payload policy as the npm `files` list: compiled lib without sourcemaps.
files:
  - lib/**/*
  - '!lib/**/*.map'
  # Desktop Chrome 的静态资产（html/css/icon）：开发与打包同一套文件，
  # main 经 lib/ 相对路径加载 src/chrome/。
  - src/chrome/**/*
  # DSH Terminal 的静态资产（html/css/vendored xterm）：同一套文件。
  - src/terminal/**/*

# Ship the licensing boundary with every packaged binary. `extraResources`
# paths resolve from the repository root and land under the app's resources
# directory, so both win-unpacked and the NSIS installer carry these notices.
extraResources:
  - from: apps/desktop/LICENSE
    to: licenses/DeepSeekGUI-PolyForm-Perimeter-1.0.1.txt
  - from: DEEPSEEKGUI-LICENSE.md
    to: licenses/DEEPSEEKGUI-LICENSE.md
  # The upstream MIT text lives in LICENSE-MIT-UPSTREAM. The repository root
  # LICENSE is a layered-licensing notice, not a license text, so it must never
  # be the source of the shipped MIT notice: MIT requires the full license text
  # and copyright notice to travel with every binary.
  - from: LICENSE-MIT-UPSTREAM
    to: licenses/DeepSeek-Harness-MIT.txt
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  # The tray icon must be a real file on disk: it is loaded through
  # nativeImage.createFromPath, which reads on the C++ side and must not be
  # asked to resolve a path inside the asar. The multi-size .ico container
  # (16/20/24/32) is what lets Windows pick the right size per DPI rather than
  # scaling one bitmap (P7-I) — and createFromBuffer is not an option here
  # because it only decodes PNG/JPEG and yields an empty image for an ICO,
  # which silently costs the app its tray (P8-D20).
  - from: apps/desktop/src/chrome/tray.ico
    to: tray.ico

# The DSH runtime is copied into resources/dsh by scripts/build-desktop-dist.ts
# after electron-builder finishes (its path resolution differs across versions).

win:
  # Resolved against the project directory (repository root), like every
  # electron-builder 26 path.
  icon: apps/desktop/build/icon.ico

linux:
  # Same root-relative resolution as win.icon above. 256x256 PNG — the same
  # source image the window chrome uses.
  icon: apps/desktop/src/chrome/icon.png
  category: Development
  # Linux derives the executable name from package.json's name by default,
  # and the scoped @see-sol-lab/deepseekgui contains characters AppImage
  # rejects. Lowercase binary name per Linux convention.
  executableName: deepseekgui
  # AppImage only for now: single file, runs on any distribution, closest to
  # the Windows one-click story. deb/rpm need maintainer identity and desktop
  # integration decisions, which belong to the full Linux packaging pass.
  target:
    - AppImage
  artifactName: DeepSeekGUI-${version}-${arch}.${ext}

nsis:
  # One-click installer (P8-D4): double-click installs and launches, no wizard —
  # the same shape VS Code, Discord and Slack ship. The audience is developers,
  # for whom "next, next, finish" adds no value, and the step right after the
  # SmartScreen warning is where users are lost.
  #
  # This also settles P8-D9. `oneClick.nsh`'s initMultiUser has exactly two
  # branches, and the per-machine one is compiled in only when
  # INSTALL_MODE_PER_ALL_USERS is defined — which happens only for
  # `perMachine: true`. With `false` below, a one-click install can only take
  # the per-user branch: %LOCALAPPDATA%\Programs\DeepSeekGUI, registered under
  # HKCU, and `installer.nsi` accordingly emits `RequestExecutionLevel user`.
  # The assisted installer used to be able to land in Program Files with HKLM
  # entries, which is what made the release notes' "current-user install, no
  # administrator rights" untrue. Verify the install location on the next
  # packaged run — that claim is now load-bearing.
  oneClick: true
  # Current-user install: no administrator rights required.
  perMachine: false
  # ManifestDPIAware (the installer's own text is otherwise rendered at 96 DPI
  # and stretched) plus the uninstall-time prompt about the data directory.
  include: apps/desktop/build/installer.nsh
  artifactName: DeepSeekGUI-Setup-${version}.exe

# Reuse the already-downloaded Electron binary; nothing to rebuild or fetch.
npmRebuild: false
electronDist: node_modules/electron/dist
