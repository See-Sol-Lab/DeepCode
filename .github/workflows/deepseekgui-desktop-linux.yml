# DeepSeekGUI Desktop — Linux packaged lane.
#
# Builds the full Linux distribution on a hosted Ubuntu runner: the same
# build:desktop-dist entry the Windows lane uses, which assembles the DSH
# runtime into resources/dsh, sanitizes the payload, and wraps it as an
# AppImage (electron-builder.yml's linux section).
#
# Still experimental — not yet a release channel. Known gaps tracked for the
# Linux port: tray icon (tray.ico needs a PNG sibling on Linux), the DSH
# Terminal shell chain (PowerShell candidates need a bash/zsh branch), and no
# packaged parity/acceptance suite runs here yet.
#
# Deliberately a separate workflow file: deepseekgui-desktop.yml documents the
# invariant that its manual dispatches always run the Windows native packaged
# job, and this lane must not weaken that. Dispatch-only — a lane this young
# should never cost a runner on push.

name: DeepSeekGUI Desktop Linux

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (same invariant as ci.yml).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  desktop-linux-appimage:
    name: desktop / linux appimage (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Release gate, same reasoning as the Windows lane: build:desktop-dist
      # compiles the host side on its way to packaging but does not cover the
      # client side, and a gate that only holds by accident is not a gate.
      - name: Repository typecheck (release gate)
        run: pnpm run typecheck

      # The full official chain: build:lib, branded web, desktop shell, then
      # the assemble script — which detects the running platform, assembles
      # the DSH runtime into resources/dsh, sanitizes, and packages the
      # AppImage. (It also self-heals the Electron binary download that
      # pnpm's install skips.)
      - name: Rebuild and package distribution from current source
        run: pnpm run build:desktop-dist

      - name: List produced artifacts
        run: ls -lh dist/desktop

      - name: Upload AppImage and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: deepseekgui-linux-experimental-${{ github.sha }}
          # Hosted-runner artifact quota: the AppImage (~150MB) and the hash
          # manifest only; the unpacked directory stays on the runner.
          path: |
            dist/desktop/DeepSeekGUI-*.AppImage
            dist/desktop/SHA256SUMS.txt
          if-no-files-found: error
